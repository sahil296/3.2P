<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>SIT 725 Prac 3 - Coffee House</title>
  <meta name="description" content="Coffee House menu for SIT 725 Prac 3">
  <meta name="author" content="Sahil Navin">

  <meta property="og:title" content="SIT 725 Prac 3 - Coffee House">
  <meta property="og:type" content="website">
  <meta property="og:description" content="Coffee House menu for SIT 725 Prac 3">

  <!-- Compiled and minified CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Custom Style Sheet-->
  <link rel="stylesheet" href="css/styles.css">

</head>

<body>
  <nav>
    <div class="nav-wrapper navbar-size">
      <a href="#" class="brand-logo"><img class="user-image-size" src="images/coffee-logo.svg" alt="Coffee logo" /></a>
      <ul id="nav-mobile" class="right hide-on-med-and-down">
        <li><a target="_blank" href="https://github.com/sahil296/3.2P">GitHub</a></li>
      </ul>
    </div>
  </nav>
  <main class="main-body">
    <div class="container">
      <div class="row">
        <div class="col s12 center-align">
          <h1 id="heading">Welcome to the Coffee House</h1>
          <p class="flow-text">Freshly brewed every day. Browse our coffee menu below, hover over a card to read more about
            each drink, and place your order using the button.</p>
        </div>
        <div class="col s12 center-align">
          <img class="materialboxed materialboxed-image" src="images/coffee-hero.jpg">
        </div>
        <div class="col s12 center-align">
          <a class="waves-effect waves-light btn click-me-button modal-trigger" id="clickMeButton"
            data-target="modal1"><i class="material-icons left">local_cafe</i>Order Now</a>
        </div>
      </div>
      <!-- Cards are added here from the GET /api/coffees endpoint -->
      <div class="row" id="card-section">
      </div>
    </div>

    <!-- Modal Structure -->
    <div id="modal1" class="modal modal-fixed-footer">
      <div class="row modal-content">
        <h5>Place Your Order</h5>
        <form class="col s12">
          <div class="row">
            <div class="input-field col s6">
              <input id="first_name" type="text" class="validate">
              <label for="first_name">First Name</label>
            </div>
            <div class="input-field col s6">
              <input id="last_name" type="text" class="validate">
              <label for="last_name">Last Name</label>
            </div>
          </div>
          <div class="row">
            <div class="input-field col s12">
              <input id="email" type="email" class="validate">
              <label for="email">Email</label>
            </div>
          </div>
          <div class="row">
            <div class="input-field col s8">
              <select id="coffee">
                <option value="" disabled selected>Choose your coffee</option>
              </select>
              <label>Coffee</label>
            </div>
            <div class="input-field col s4">
              <input id="quantity" type="number" min="1" value="1" class="validate">
              <label for="quantity" class="active">Quantity</label>
            </div>
          </div>
          <div class="row">
            <div class="input-field col s12 center-align">
              <a class="waves-effect waves-light btn" id="formSubmit">submit</a>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <a href="#!" class="modal-close waves-effect btn-flat">Close</a>
      </div>
    </div>
  </main>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"
    integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
  <!-- Compiled and minified JavaScript -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="js/scripts.js"></script>
</body>

</html>
